<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    div{
        height: 100px; /*  블록 요소는 높이 기본 = 0*/
        max-width: none;
        min-width: inherit;
        background-color: tomato;
    }
    span{
        /*인라인 요소는 높이, 너비 기본 = 0*/
        background-color: purple;
    }
</style>
<body>
    
    <div></div>
    <hr>

    <span>컨텐츠</span>
</body>
</html>
