<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Hero Section</title>
    <style>
        body {
            margin: 0;
            font-family: sans-serif;
        }

        .hero {
            height: 100vh;
            background-image: url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .hero-content {
            background-color: rgba(0, 0, 0, 0.5);
            color: white;
            padding: 40px;
            text-align: center;
            border-radius: 10px;
        }

        .hero-content h1 {
            margin: 0 0 10px;
            font-size: 3rem;
        }

        .hero-content p {
            margin-bottom: 20px;
            font-size: 1.2rem;
        }

        .hero-content button {
            padding: 12px 30px;
            font-size: 1rem;
            color: white;
            background-color: #007bff;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .hero-content button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <section class="hero">
        <div class="hero-content">
            <h1>환영합니다</h1>
            <p>최고의 서비스를 제공합니다</p>
            <button>시작하기</button>
        </div>
    </section>

</body>
</html>
