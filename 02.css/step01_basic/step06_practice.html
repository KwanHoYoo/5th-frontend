<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        ul.menu {
            list-style-type: none;
            padding: 0;
        }

        .menu li a {
            color: black;
            text-decoration: none;
        }

        .menu li a::before {
            content: "> ";
            margin-right: 5px;
        }

        .menu li.active a{
            color: blue;
            font-weight: bold;
        }

        .menu li a:hover {
            background-color: lightgrey;
        }
        .menu li {
            display: inline-block;
            margin-right: 20px;
        }
    </style>
</head>
<body>
    <nav>
        <ul class="menu">
            <li><a href="#home">홈</a></li>
            <li><a href="#about">소개</a></li>
            <li class="active"><a href="#services">서비스</a></li>
            <li><a href="#contact">연락처</a></li>
        </ul>
    </nav>
</body>
</html>
